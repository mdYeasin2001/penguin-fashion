name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v2
            
            - name: Set up SSH
              uses: webfactory/ssh-agent@v0.5.4
              with:
                ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
            
            - name: Sync files to VPS
              run: |
                rsync -avz --delete \
                -e "ssh -o StrictHostKeyChecking=no" \
                ./ root@159.89.235.237:/var/www/penguin-fashion
            
            - name: Reload Nginx
              run: |
                ssh -o StrictHostKeyChecking=no root@159.89.235.237 "sudo systemctl reload nginx"